# All relative paths are resolved from THIS YAML file, not the shell cwd.
# One configuration supports both phase-only and phase + amplitude runs.
# Calibration files are configured once. Change input paths for new data.
name: Q1_L_LM6c
pupil_file: ~/heeps_metis/input_files/pupil/ELT_fullM1_feb2025_noseg.fits
mask_file: ~/heeps_metis/input_files/pupil/ls/mask/ls_SPM_LM6c.fits
output_dir: ../outputs/heeps_l6

# Inputs: real optical path difference, NOT phase in radians.
phase_files:
  - path: ~/heeps_metis/input_files/wavefront/cube_Q1_3600_100ms_L.fits
    global_start: 0
phase_unit: m                 # m, um, or nm of OPD; converted to meters for HEEPS
# Phase + amplitude: keep the list below (real field amplitude, not intensity).
# Phase-only: replace this entire amplitude_files block with:
# amplitude_files: []
amplitude_files:
  - path: ~/heeps_metis/input_files/wavefront/L_rep_1.fits
    global_start: 0

pure: false                  # For a static PSF: true, phase_files: [], amplitude_files: []
band: L
mask_name: LM6c
# Choose band above; auto uses its spectrum and sampling from this table.
# Non-L bandwidths are unspecified: monochromatic until you set frac_bw/nlam.
spectrum: auto
band_specs:
  L:
    lambda_center_m: 3.81e-06
    pixel_scale_mas: 5.47
    frac_bw: 0.182
    nlam: 5
  M:
    lambda_center_m: 4.79e-06
    pixel_scale_mas: 5.47
    frac_bw: 0.0
    nlam: 1
  N1:
    lambda_center_m: 8.7e-06
    pixel_scale_mas: 6.79
    frac_bw: 0.0
    nlam: 1
  N2:
    lambda_center_m: 1.133e-05
    pixel_scale_mas: 6.79
    frac_bw: 0.0
    nlam: 1
# Alternative spectrum, replacing the mapping above:
# spectrum:
#   wavelengths_m: [3.5e-6, 3.81e-6, 4.1e-6]
#   weights: [0.2, 0.6, 0.2]

frame_start: 0               # Global frame index, inclusive
nframes: null                # Infer all available common frames; or set an integer
cadence_s: 0.1               # Explicit source cadence; verify for each dataset
pixel_scale_mas: auto        # Selected from band_specs, in mas/pixel
hfov_arcsec: 1.1             # HALF field of view
ngrid: 1024
chunk_size: 100
cpu_count: 1
run_mode: preview            # Change to full, or pass --full
preview_frames: 2
